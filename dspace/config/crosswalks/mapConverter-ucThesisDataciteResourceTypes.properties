# Maps the plain value of dc.type onto a DataCite kernel-4 resourceTypeGeneral, for the DOIs
# registered for University of Cyprus doctoral theses.
#
# The stock mapConverter-datacitePublicationTypes.properties cannot be used here: its bean sets
# useAuthority=true, so it keys on the COAR authority of dc.type and ignores plain text values.
# This file is read by a bean with useAuthority=false, so the keys below are dc.type VALUES.
#
# Unmapped values fall back to the bean's defaultValue (Text), which keeps the XML valid.

# The value stored by the phd submission form (value-pairs "common_types_phd")
Doctoral\ Thesis = Dissertation

# The openaire/driver style value, in case dc.type holds it directly
info\:eu-repo/semantics/doctoralThesis = Dissertation

# Other thesis levels, so the mapping stays correct if the DOI filter is ever widened
Master\ Thesis = Dissertation
Bachelor\ Thesis = Dissertation
info\:eu-repo/semantics/masterThesis = Dissertation
info\:eu-repo/semantics/bachelorThesis = Dissertation
