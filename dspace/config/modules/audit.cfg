#---------------------------------------------------------------#
#-----------------..AUDIT CONFIGURATIONS------------------------#
#---------------------------------------------------------------#
# Configuration properties used by the Audit Event System       #
# faceted-search system.                                        #
#---------------------------------------------------------------#
# Enable the audit system
# Defaults to FALSE, please note that the audit system requires the audit
# consumer to be included in the default dispatcher consumers (this is true
# by default), see dspace.cfg
#
# Enabled here: it is the structured, admin-only ("ADMIN" authority) replacement for the
# ad-hoc dc.subject-based action logging previously done via dspace.action.report.*
# (see updateReportItem() in ItemServiceImpl / InstallItemServiceImpl, and
# docs/Audit-Item-Actions.md for how to use and retire the old one).
audit.enabled = true

##### Audit Indexing #####
solr.audit.server = ${solr.server}/${solr.multicorePrefix}audit

# How many days of audit events to keep. Nothing prunes the audit core automatically - run
#   [dspace]/bin/dspace audit-cleanup
# periodically (e.g. from cron) to delete events older than this. Use --dry-run first to see how
# many events a given retention period would remove without deleting anything, and --days to
# override this value for a single run.
audit.retention.days = 365