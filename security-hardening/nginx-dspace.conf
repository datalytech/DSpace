# ===========================================================================
# nginx server block για DSpace 7 / DSpace-CRIS σε Docker
# (εναλλακτική του apache-dspace-vhost.conf - χρησιμοποίησε ΕΝΑ από τα δύο)
#
# Αντικατάστησε ΟΛΑ τα gnosis2.lib.ucy.ac.cy με το δικό σου hostname.
# ===========================================================================

upstream dspace_backend  { server 127.0.0.1:8080; keepalive 16; }
upstream dspace_frontend { server 127.0.0.1:4000; keepalive 16; }

# --- port 80: μόνο redirect -------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name gnosis2.lib.ucy.ac.cy;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name gnosis2.lib.ucy.ac.cy;

    access_log /var/log/nginx/dspace-access.log;
    error_log  /var/log/nginx/dspace-error.log;

    # --- TLS ---------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/gnosis2.lib.ucy.ac.cy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gnosis2.lib.ucy.ac.cy/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    server_tokens off;            # μην διαρρέεις "nginx/1.24.0"
    client_max_body_size 4G;      # DSpace bitstream uploads

    # -----------------------------------------------------------------------
    # ΕΥΡΗΜΑ 2: HSTS Missing From HTTPS Server (RFC 6797)
    # -----------------------------------------------------------------------
    # ΞΕΚΙΝΑ με max-age=300, επιβεβαίωσε ότι δεν σπάει τίποτα, μετά 31536000.
    #   add_header Strict-Transport-Security "max-age=300" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options "nosniff"                      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options        "SAMEORIGIN"                   always;

    # ΠΡΟΣΟΧΗ nginx: το add_header ΔΕΝ κληρονομείται σε ένα location που έχει
    # τα δικά του add_header - τα ξαναγράφει όλα. Αν προσθέσεις add_header
    # μέσα σε location, ξανά-δήλωσε εκεί και τα 4 από πάνω (ή χρησιμοποίησε
    # το module headers-more).

    # -----------------------------------------------------------------------
    # ΕΥΡΗΜΑ 1: Apache Tomcat Default Files
    # -----------------------------------------------------------------------
    location ~* ^/(docs|examples|manager|host-manager)(/|$)        { return 404; }
    location ~* ^/(RELEASE-NOTES\.txt|LICENSE|NOTICE|RUNNING\.txt) { return 404; }
    location ~* ^/tomcat[^/]*\.(svg|gif|png|ico)$                  { return 404; }
    location ~* ^/(WEB-INF|META-INF)(/|$)                          { return 404; }
    location ~* ^/rest(/|$)   { return 404; }   # deprecated v6 REST API
    location ~* ^/solr(/|$)   { return 404; }   # Solr: ποτέ δημόσιο

    # -----------------------------------------------------------------------
    # Reverse proxy
    # -----------------------------------------------------------------------
    location /server {
        proxy_pass         http://dspace_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;   # ώστε το DSpace να παράγει https URLs
        proxy_set_header   X-Forwarded-Port  443;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Angular UI (SSR). Catch-all - τελευταίο.
    location / {
        proxy_pass         http://dspace_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 600s;
    }
}
