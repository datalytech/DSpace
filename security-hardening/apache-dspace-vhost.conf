# ===========================================================================
# Apache httpd vhost για DSpace 7 / DSpace-CRIS σε Docker
#
# Διορθώνει τα scanner findings:
#   * "HSTS Missing From HTTPS Server (RFC 6797)"  -> Strict-Transport-Security
#   * "Apache Tomcat Default Files"                 -> blocks των default paths
#
# Προϋποθέσεις:
#   a2enmod ssl headers proxy proxy_http remoteip rewrite
#   systemctl restart apache2
#
# Υποθέτει (δες docker-compose.prod.yml) ότι τα containers είναι bound
# ΜΟΝΟ στο localhost του host:
#   127.0.0.1:8080 -> dspace backend (Tomcat, webapp στο /server)
#   127.0.0.1:4000 -> dspace-angular (Node SSR)
#
# Αντικατάστησε ΟΛΑ τα gnosis2.lib.ucy.ac.cy με το δικό σου hostname.
# ===========================================================================

# ---------------------------------------------------------------------------
# Port 80 - μόνο για redirect. Το HSTS header ΔΕΝ στέλνεται σε plain HTTP
# (το RFC 6797 ορίζει ότι οι browsers το αγνοούν εκτός HTTPS).
# ---------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName gnosis2.lib.ucy.ac.cy

    # Άφησε περαστό μόνο το ACME challenge για Let's Encrypt
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
        RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [L,R=301]
    </IfModule>
</VirtualHost>


<VirtualHost *:443>
    ServerName gnosis2.lib.ucy.ac.cy
    ServerAdmin webmaster@lib.ucy.ac.cy

    ErrorLog  ${APACHE_LOG_DIR}/dspace-error.log
    CustomLog ${APACHE_LOG_DIR}/dspace-access.log combined

    # -----------------------------------------------------------------------
    # TLS
    # -----------------------------------------------------------------------
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/gnosis2.lib.ucy.ac.cy/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/gnosis2.lib.ucy.ac.cy/privkey.pem

    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder     off
    SSLSessionTickets       off
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384

    # -----------------------------------------------------------------------
    # ΕΥΡΗΜΑ 2: HSTS Missing From HTTPS Server (RFC 6797)
    # -----------------------------------------------------------------------
    # ΞΕΚΙΝΑ με max-age=300 για 1-2 μέρες. Επιβεβαίωσε ότι ΤΙΠΟΤΑ στο site
    # δεν σπάει (OAI-PMH harvesters, SWORD clients, Shibboleth, IIIF viewers,
    # handle resolver) και ΜΕΤΑ ανέβασέ το στο 31536000 (1 χρόνος).
    #
    # Το HSTS είναι μη-αναστρέψιμο για όσο διαρκεί το max-age στον browser
    # του κάθε χρήστη. Δεν μπορείς να το "πάρεις πίσω" γρήγορα.
    #
    #   Header always set Strict-Transport-Security "max-age=300"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    #
    # Το includeSubDomains εδώ αφορά ΜΟΝΟ το gnosis2.lib.ucy.ac.cy και τυχόν
    # subdomains ΤΟΥ. ΔΕΝ επηρεάζει αδέλφια όπως www.lib.ucy.ac.cy.
    # Το "; preload" ΜΗΝ το βάλεις - θέλει υποβολή στη λίστα του Chrome και
    # είναι πολύ δύσκολο να αναιρεθεί.

    # -----------------------------------------------------------------------
    # Υπόλοιπα security headers (τα ζητάει το επόμενο scan)
    # -----------------------------------------------------------------------
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy        "strict-origin-when-cross-origin"
    Header always set X-Frame-Options        "SAMEORIGIN"
    Header always set Cross-Origin-Opener-Policy "same-origin"

    # Μην διαρρέεις τον stack. Το ServerTokens/ServerSignature είναι global
    # (apache2.conf / security.conf), όχι per-vhost:
    #     ServerTokens Prod
    #     ServerSignature Off
    Header always unset X-Powered-By
    Header always unset X-AspNet-Version
    Header unset Server

    # -----------------------------------------------------------------------
    # ΕΥΡΗΜΑ 1: Apache Tomcat Default Files
    # -----------------------------------------------------------------------
    # Αυτό είναι το "πανωφόρι". Το πραγματικό fix είναι να μην υπάρχουν καν
    # μέσα στο container (Dockerfile.tomcat-hardened) και να μην είναι η 8080
    # δημόσια (docker-compose.prod.yml). Αλλά ένα block εδώ σταματά και ό,τι
    # τυχόν επανέλθει μετά από ένα image rebuild.
    <LocationMatch "^/(docs|examples|manager|host-manager)(/|$)">
        Require all denied
    </LocationMatch>
    RedirectMatch 404 "(?i)^/(RELEASE-NOTES\.txt|LICENSE|NOTICE|RUNNING\.txt|tomcat[^/]*\.(svg|gif|png|ico))$"
    RedirectMatch 404 "(?i)^/(WEB-INF|META-INF)(/|$)"

    # Το deprecated v6 REST API. Το deployάρει μόνο το Dockerfile.test, με
    # web.xml ξαναγραμμένο ώστε να δέχεται plain HTTP. Αν ΔΕΝ το χρησιμοποιεί
    # κανένας client σου, κλείσ' το.
    <LocationMatch "^/rest(/|$)">
        Require all denied
    </LocationMatch>

    # Solr: ΠΟΤΕ δημόσιο. Δεν έχει authentication by default.
    <LocationMatch "^/solr(/|$)">
        Require all denied
    </LocationMatch>

    # -----------------------------------------------------------------------
    # Reverse proxy
    # -----------------------------------------------------------------------
    # Πες στον Tomcat ότι το αρχικό request ήταν HTTPS, ώστε το DSpace να
    # παράγει https URLs (αλλιώς mixed content + σπασμένα HATEOAS links).
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # Σωστή IP πελάτη στα DSpace statistics (αλλιώς όλα τα views μετριούνται
    # ως η IP του proxy). Θέλει a2enmod remoteip + RemoteIpValve στον Tomcat.
    <IfModule mod_remoteip.c>
        RemoteIPHeader X-Forwarded-For
        RemoteIPInternalProxy 127.0.0.1
    </IfModule>

    ProxyPreserveHost On
    ProxyRequests     Off
    ProxyTimeout      600

    # DSpace REST API (backend container)
    ProxyPass        /server  http://127.0.0.1:8080/server  connectiontimeout=5 timeout=600
    ProxyPassReverse /server  http://127.0.0.1:8080/server

    # Angular UI με Server-Side Rendering (frontend container).
    # Catch-all - ΠΡΕΠΕΙ να είναι τελευταίο.
    ProxyPass        /  http://127.0.0.1:4000/  connectiontimeout=5 timeout=600
    ProxyPassReverse /  http://127.0.0.1:4000/

    # Αν χρησιμοποιείς Shibboleth, κράτα το /Shibboleth.sso τοπικό:
    #   ProxyPass /Shibboleth.sso !
</VirtualHost>
